services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: acme_app
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
    depends_on:
      database:
        condition: service_healthy
      database_testing:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: acme_nginx
    ports:
      - "8080:80"
    volumes:
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html
    depends_on:
      - app

  database:
    image: mariadb:11.8
    container_name: acme_db
    environment:
      MARIADB_DATABASE: acme
      MARIADB_USER: acme
      MARIADB_PASSWORD: 12345678
      MARIADB_ROOT_PASSWORD: 12345678
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  database_testing:
    image: mariadb:11.8
    container_name: acme_db_test
    environment:
      MARIADB_DATABASE: acme_test
      MARIADB_USER: acme
      MARIADB_PASSWORD: 12345678
      MARIADB_ROOT_PASSWORD: 12345678
    volumes:
      - db_test_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  db_test_data:
